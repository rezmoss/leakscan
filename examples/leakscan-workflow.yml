# copy to .github/workflows/leakscan.yml in target repo
name: leakscan

on:
  push:
  pull_request:

permissions:
  contents: read
  security-events: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"

      - name: Scan history
        id: scan
        run: |
          go install github.com/rezmoss/leakscan@latest
          leakscan git -format sarif . > leakscan.sarif || echo "status=$?" >> "$GITHUB_OUTPUT"

      - uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: leakscan.sarif
          category: leakscan

      - name: Fail on findings
        if: steps.scan.outputs.status != ''
        run: exit 1
